# Test-only overrides. Deliberately standalone so `mvn test` passes on a fresh clone with no
# .env file and no Google credentials.
#
# The JWT secret below is a public, test-scoped value - never a real secret. It only has to be
# at least 32 characters because JwtService enforces that for every environment.
app.jwt.secret=unit-test-only-secret-0123456789-abcdef-xyz
app.jwt.expiration-seconds=3600

# Non-empty placeholders: the OAuth2 client registration must exist so the security filter chain
# can be built, but no network call is ever made during tests.
spring.security.oauth2.client.registration.google.client-id=test-client-id-not-used
spring.security.oauth2.client.registration.google.client-secret=test-client-secret-not-used

















