# ---------------------------------------------------------------------------
# BHOOMI-DRISHTI backend configuration (Phase 1 + Phase 2: authentication)
#
# Every value can be overridden with an environment variable. For local work the
# repository root `.env` file (copy it from .env.example) is imported below, so the
# same file configures Docker Compose, the backend and the frontend.
# Secrets (JWT_SECRET, GOOGLE_CLIENT_ID/SECRET, database password) only ever live
# in `.env`, which is git-ignored - never in this file or in source code.
# ---------------------------------------------------------------------------

server:
  port: ${BACKEND_PORT:8080}

spring:
  application:
    name: bhoomi-drishti-backend

  # Optional: load the root .env file when the backend is started from `backend/`.
  # OS environment variables always take precedence over values from this file.
  config:
    import: optional:file:../.env[.properties]

  datasource:
    url: jdbc:postgresql://localhost:${DATABASE_PORT:5432}/${DATABASE_NAME:bhoomi_drishti}
    username: ${DATABASE_USER:bhoomi}
    password: ${DATABASE_PASSWORD:change_me}

  # Schema is managed by Flyway migrations in src/main/resources/db/migration.
  flyway:
    enabled: true
    # The PostGIS image creates a few extension objects in `public` before the first
    # migration runs; baselining lets V1 apply cleanly even on an existing database.
    baseline-on-migrate: true
    baseline-version: 0

  jpa:
    hibernate:
      # Never generate schema from entities - Flyway owns the schema.
      ddl-auto: none
    open-in-view: false

  sql:
    init:
      mode: never

  # Google OpenID Connect (Phase 2). Credentials come from .env; see
  # docs/api/google-oauth-setup.md. The provider URIs are written out explicitly so
  # startup never needs network access (issuer-uri would run OIDC discovery on every boot).
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:not_configured}
            client-secret: ${GOOGLE_CLIENT_SECRET:not_configured}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-authentication-method: client_secret_post
            scope:
              - openid
              - profile
              - email
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://openidconnect.googleapis.com/v1/userinfo
            jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
            user-name-attribute: sub

# Application settings (non-secret defaults; secrets are injected from .env).
app:
  # Origins allowed to call the API from a browser. Keep explicit - never "*".
  cors:
    allowed-origins:
      - http://localhost:${FRONTEND_PORT:5173}

  # Access-token signing. JWT_SECRET must be present in .env and at least 32 characters;
  # the application refuses to start otherwise (see JwtService).
  jwt:
    secret: ${JWT_SECRET:}
    # Token lifetime in seconds (default 24 hours); also the cookie's Max-Age.
    expiration-seconds: ${JWT_EXPIRATION:86400}

  # Session cookie that carries the token to the browser.
  auth:
    cookie-name: ${AUTH_COOKIE_NAME:bhoomi_auth}
    # Switch to true when the API is served over HTTPS - browsers drop Secure cookies on http://.
    cookie-secure: ${COOKIE_SECURE:false}
    cookie-same-site: ${COOKIE_SAMESITE:Lax}
    # Where the Google callback sends the browser after sign-in.
    frontend-base-url: http://localhost:${FRONTEND_PORT:5173}

logging:
  level:
    root: INFO
    com.bhoomidrishti: INFO
    org.springframework.web: INFO
